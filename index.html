<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="images/profile.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahesh Saran — AI &amp; Systems Software Engineer</title>
    <meta name="description" content="Mahesh Saran — B.Tech CSE & AIML student (JIET Jodhpur). Linux kernel contributor (mt76), builder of distributed systems (Relay) and low-latency AI tools." />
    <meta property="og:title" content="Mahesh Saran — AI & Systems Software Engineer" />
    <meta property="og:description" content="Linux kernel contributor (mt76), distributed job scheduler (Relay), LLM bug-detection evals, and real-time Voice AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mah3shbishnoi.github.io/portfolio/" />
    <meta property="og:image" content="https://mah3shbishnoi.github.io/portfolio/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const img = new Image();
      img.src = 'images/profile.jpg';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(32, 32, 32, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0, 64, 64);
        const link = document.querySelector("link[rel*='icon']");
        if(link) {
          link.type = 'image/png';
          link.href = canvas.toDataURL();
        }
      };
    </script>
  </body>
</html>
